# Sixteen distinct columns, so common subexpression elimination cannot merge the calls.
[[case]]
name = "add_one/calls_16"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS SELECT
    (i + 0)::BIGINT AS c0, (i + 1)::BIGINT AS c1, (i + 2)::BIGINT AS c2, (i + 3)::BIGINT AS c3,
    (i + 4)::BIGINT AS c4, (i + 5)::BIGINT AS c5, (i + 6)::BIGINT AS c6, (i + 7)::BIGINT AS c7,
    (i + 8)::BIGINT AS c8, (i + 9)::BIGINT AS c9, (i + 10)::BIGINT AS c10, (i + 11)::BIGINT AS c11,
    (i + 12)::BIGINT AS c12, (i + 13)::BIGINT AS c13, (i + 14)::BIGINT AS c14, (i + 15)::BIGINT AS c15
FROM range({rows}) r(i)
"""]
query = """
SELECT vs_add_one(c0), vs_add_one(c1), vs_add_one(c2), vs_add_one(c3),
       vs_add_one(c4), vs_add_one(c5), vs_add_one(c6), vs_add_one(c7),
       vs_add_one(c8), vs_add_one(c9), vs_add_one(c10), vs_add_one(c11),
       vs_add_one(c12), vs_add_one(c13), vs_add_one(c14), vs_add_one(c15)
FROM t
"""
check = """
SELECT count(*)::VARCHAR FROM t
WHERE vs_add_one(c0) IS DISTINCT FROM c0 + 1 OR vs_add_one(c1) IS DISTINCT FROM c1 + 1
   OR vs_add_one(c2) IS DISTINCT FROM c2 + 1 OR vs_add_one(c3) IS DISTINCT FROM c3 + 1
   OR vs_add_one(c4) IS DISTINCT FROM c4 + 1 OR vs_add_one(c5) IS DISTINCT FROM c5 + 1
   OR vs_add_one(c6) IS DISTINCT FROM c6 + 1 OR vs_add_one(c7) IS DISTINCT FROM c7 + 1
   OR vs_add_one(c8) IS DISTINCT FROM c8 + 1 OR vs_add_one(c9) IS DISTINCT FROM c9 + 1
   OR vs_add_one(c10) IS DISTINCT FROM c10 + 1 OR vs_add_one(c11) IS DISTINCT FROM c11 + 1
   OR vs_add_one(c12) IS DISTINCT FROM c12 + 1 OR vs_add_one(c13) IS DISTINCT FROM c13 + 1
   OR vs_add_one(c14) IS DISTINCT FROM c14 + 1 OR vs_add_one(c15) IS DISTINCT FROM c15 + 1
"""
expect = "0"

