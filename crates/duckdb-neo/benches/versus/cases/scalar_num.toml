# ---------------------------------------------------------------------------------------------------------------------
# vs_clamp(v DOUBLE, lo DOUBLE, hi DOUBLE) -> DOUBLE: min(max(v, lo), hi). lo > hi yields hi.

[[case]]
name = "clamp/columns"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT
    CASE WHEN i % 10 = 9 THEN NULL ELSE (i * 7919 % 2001 - 1000) / 1000.0 END::DOUBLE AS x,
    CASE WHEN i % 13 = 12 THEN NULL ELSE (i % 5) / 10.0 - 0.5 END::DOUBLE AS lo,
    ((i % 7) / 10.0 - 0.2)::DOUBLE AS hi
FROM range({rows}) r(i)
"""]
query = "SELECT vs_clamp(x, lo, hi) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_clamp(x, lo, hi) IS DISTINCT FROM
            CASE WHEN x IS NULL OR lo IS NULL OR hi IS NULL THEN NULL ELSE least(greatest(x, lo), hi) END)
        + (vs_clamp('inf'::DOUBLE, 0, 1) IS DISTINCT FROM 1)::BIGINT
        + (vs_clamp('-inf'::DOUBLE, 0, 1) IS DISTINCT FROM 0)::BIGINT
        + (vs_clamp(0.5, 1, 0) IS DISTINCT FROM 0)::BIGINT
        + (vs_clamp(0.5, NULL, 1) IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# Literal bounds reach the function as CONSTANT vectors next to a flat column.
[[case]]
name = "clamp/const_bounds"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT
    CASE WHEN i % 10 = 9 THEN NULL ELSE (i * 7919 % 2001 - 1000) / 1000.0 END::DOUBLE AS x
FROM range({rows}) r(i)
"""]
query = "SELECT vs_clamp(x, 0.25, 0.75) FROM t"
check = """
SELECT count(*) FILTER (WHERE vs_clamp(x, 0.25, 0.75) IS DISTINCT FROM
           CASE WHEN x IS NULL THEN NULL ELSE least(greatest(x, 0.25), 0.75) END)::VARCHAR
FROM t
"""
expect = "0"

# The cross product repeats the single row of b as CONSTANT vectors, so every argument is constant.
[[case]]
name = "clamp/const_all"
rows = [1, 2048, 100_000, 2_000_000]
setup = [
    "CREATE TABLE t AS SELECT i::BIGINT AS v FROM range({rows}) r(i)",
    "CREATE TABLE b AS SELECT 0.9::DOUBLE AS x, 0.25::DOUBLE AS lo, 0.75::DOUBLE AS hi",
]
query = "SELECT vs_clamp(x, lo, hi) FROM t, b"
check = """
SELECT (count(*) FILTER (WHERE c IS DISTINCT FROM 0.75) + (count(*) <> {rows})::BIGINT)::VARCHAR
FROM (SELECT vs_clamp(x, lo, hi) AS c FROM t, b)
"""
expect = "0"

