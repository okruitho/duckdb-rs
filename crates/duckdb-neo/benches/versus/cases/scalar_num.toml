# ---------------------------------------------------------------------------------------------------------------------
# vs_checked_div(a BIGINT, b BIGINT) -> BIGINT: truncating a / b, NULL for b = 0 and for MIN / -1.

[[case]]
name = "checked_div/project"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT
    CASE WHEN i % 10 = 9 THEN NULL WHEN i % 100 = 7 THEN -9223372036854775808 ELSE i * 37 - 50000 END::BIGINT AS a,
    (i % 11 - 5)::BIGINT AS b
FROM range({rows}) r(i)
"""]
query = "SELECT vs_checked_div(a, b) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_checked_div(a, b) IS DISTINCT FROM
            CASE WHEN b = 0 OR (a = -9223372036854775808 AND b = -1) THEN NULL ELSE a // b END)
        + (vs_checked_div((-9223372036854775808)::BIGINT, -1) IS NOT NULL)::BIGINT
        + (vs_checked_div(1, 0) IS NOT NULL)::BIGINT
        + (vs_checked_div(-7, 2) IS DISTINCT FROM -3)::BIGINT
        + (vs_checked_div((-9223372036854775808)::BIGINT, 1) IS DISTINCT FROM (-9223372036854775808)::BIGINT)::BIGINT
       )::VARCHAR
FROM t
"""
expect = "0"

# ---------------------------------------------------------------------------------------------------------------------
# vs_mix(a INTEGER, b BIGINT, c DOUBLE, d SMALLINT) -> DOUBLE: a * c + b - d in double arithmetic.

[[case]]
name = "mix/project"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT
    (i % 1000 - 500)::INTEGER AS a,
    (i * 3)::BIGINT AS b,
    CASE WHEN i % 10 = 9 THEN NULL ELSE (i % 100) / 8.0 END::DOUBLE AS c,
    (i % 300 - 150)::SMALLINT AS d
FROM range({rows}) r(i)
"""]
query = "SELECT vs_mix(a, b, c, d) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_mix(a, b, c, d) IS DISTINCT FROM a::DOUBLE * c + b::DOUBLE - d::DOUBLE)
        + (vs_mix(2147483647, 9223372036854775807, 1e290, (-32768)::SMALLINT) IS DISTINCT FROM
           2147483647::DOUBLE * 1e290 + 9223372036854775807::DOUBLE + 32768::DOUBLE)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# Without NULLs, C++'s ScalarExecutor takes its all-valid loop, which the compiler vectorizes.
[[case]]
name = "mix/nulls_0"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT
    (i % 1000 - 500)::INTEGER AS a,
    (i * 3)::BIGINT AS b,
    ((i % 100) / 8.0)::DOUBLE AS c,
    (i % 300 - 150)::SMALLINT AS d
FROM range({rows}) r(i)
"""]
query = "SELECT vs_mix(a, b, c, d) FROM t"
check = "SELECT count(*) FILTER (WHERE vs_mix(a, b, c, d) IS DISTINCT FROM a::DOUBLE * c + b::DOUBLE - d::DOUBLE)::VARCHAR FROM t"
expect = "0"

# ---------------------------------------------------------------------------------------------------------------------
# vs_strict_sqrt(DOUBLE) -> DOUBLE: sqrt(v), an error for negative v. The timed query never fails; the check reaches
# the error through TRY, which turns each failing row into NULL.

[[case]]
name = "strict_sqrt/project"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["CREATE TABLE t AS SELECT CASE WHEN i % 10 = 9 THEN NULL ELSE i / 7 END::DOUBLE AS x FROM range({rows}) r(i)"]
query = "SELECT vs_strict_sqrt(x) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_strict_sqrt(x) IS DISTINCT FROM sqrt(x))
        + (count(TRY(vs_strict_sqrt(x - 3))) <> count(*) FILTER (WHERE x >= 3))::BIGINT
        + (TRY(vs_strict_sqrt(-1.0)) IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

