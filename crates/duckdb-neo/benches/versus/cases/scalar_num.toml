# ---------------------------------------------------------------------------------------------------------------------
# Every function once on a one-row table: the fixed cost per query and per call.

[[case]]
name = "all/one_row"
rows = [1]
setup = ["CREATE TABLE t AS SELECT i::BIGINT AS v, (i / 2 + 0.5)::DOUBLE AS x, i::INTEGER AS a, (i % 1000)::SMALLINT AS d FROM range({rows}) r(i)"]
query = """
SELECT vs_add_one(v), vs_clamp(x, 0.0, 1.0), vs_is_even(v), vs_coalesce_zero(v),
       vs_checked_div(v, 3), vs_mix(a, v, x, d), vs_strict_sqrt(x), vs_scale(v, 3)
FROM t
"""
check = """
SELECT count(*)::VARCHAR FROM t
WHERE vs_add_one(v) IS DISTINCT FROM v + 1
   OR vs_clamp(x, 0.0, 1.0) IS DISTINCT FROM least(greatest(x, 0.0), 1.0)
   OR vs_is_even(v) IS DISTINCT FROM v % 2 = 0
   OR vs_coalesce_zero(v) IS DISTINCT FROM v
   OR vs_checked_div(v, 3) IS DISTINCT FROM v // 3
   OR vs_mix(a, v, x, d) IS DISTINCT FROM a::DOUBLE * x + v::DOUBLE - d::DOUBLE
   OR vs_strict_sqrt(x) IS DISTINCT FROM sqrt(x)
   OR vs_scale(v, 3) IS DISTINCT FROM v * 3
"""
expect = "0"
