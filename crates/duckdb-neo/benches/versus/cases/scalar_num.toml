SELECT (count(*) FILTER (WHERE vs_is_even(v) IS DISTINCT FROM v % 2 = 0)
        + ((SELECT count(*) FROM t WHERE vs_is_even(v)) <> count(*) FILTER (WHERE v % 2 = 0))::BIGINT
        + (vs_is_even((-9223372036854775808)::BIGINT) IS DISTINCT FROM true)::BIGINT
        + (vs_is_even(-3) IS DISTINCT FROM false)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

