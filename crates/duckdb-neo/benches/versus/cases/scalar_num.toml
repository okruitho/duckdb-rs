# Sixteen call sites with different factors: sixteen binds per prepare and no common subexpressions.
[[case]]
name = "scale/calls_16"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT CASE WHEN i % 10 = 9 THEN NULL ELSE i - 1000 END::BIGINT AS v FROM range({rows}) r(i)"]
