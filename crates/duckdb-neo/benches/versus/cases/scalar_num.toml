# Numeric scalar functions; see the header of rust/scalar_num.rs for their semantics.
# Tables are built from range() rather than passing range() to the functions directly: its column arrives as a
# SEQUENCE (OTHER) vector, which neither API's typed reader accepts without flattening.

# ---------------------------------------------------------------------------------------------------------------------
# vs_add_one(BIGINT) -> BIGINT: wrapping v + 1, NULL in, NULL out.

[[case]]
name = "add_one/project"
rows = [1, 64, 2048, 100_000, 2_000_000]
setup = ["CREATE TABLE t AS SELECT i::BIGINT AS v FROM range({rows}) r(i)"]
query = "SELECT vs_add_one(v) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_add_one(v) IS DISTINCT FROM v + 1)
        + (vs_add_one(9223372036854775807) IS DISTINCT FROM (-9223372036854775808)::BIGINT)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# The filter slices its output, so the function receives a selection of the scanned vector.
[[case]]
name = "add_one/filtered"
rows = [1, 64, 2048, 100_000, 2_000_000]
setup = ["CREATE TABLE t AS SELECT i::BIGINT AS v FROM range({rows}) r(i)"]
query = "SELECT vs_add_one(v) FROM t WHERE v % 3 <> 1"
check = """
SELECT count(*)::VARCHAR
FROM (SELECT v, vs_add_one(v) AS a FROM t WHERE v % 3 <> 1)
WHERE a IS DISTINCT FROM v + 1
"""
expect = "0"

