# A dictionary-compressed VARCHAR column in a checkpointed database: length() runs on its 16-entry dictionary and
# hands the function a DICTIONARY vector over it.
[[case]]
name = "add_one/dictionary"
rows = [1, 2048, 100_000, 2_000_000]
setup = [
    "ATTACH '{tmp}/dictionary.db' AS f",
    "CREATE TABLE f.t AS SELECT (i % 16)::VARCHAR AS s FROM range({rows}) r(i)",
    "CHECKPOINT f",
]
query = "SELECT vs_add_one(length(s)) FROM f.t"
check = "SELECT count(*)::VARCHAR FROM f.t WHERE vs_add_one(length(s)) IS DISTINCT FROM length(s) + 1"
expect = "0"

