# Every function once over a single row, so fixed per-query and per-callback costs dominate.
[[case]]
name = "mixed/one_row"
rows = [1]
setup = ["""
CREATE TABLE t AS
SELECT i::BIGINT AS i, (i * 7919 % 100003 - 50000)::BIGINT AS v, ((i * 31 % 1000) * 0.25)::DOUBLE AS d,
       (1 + i % 7)::DOUBLE AS w, i % 3 = 0 AS b
FROM range({rows}) r(i)
"""]
query = "SELECT vs_sum(v), vs_avg(d), vs_count_if(b), vs_spread(v), vs_wavg(d, w), vs_sum_scaled(v, 3) FROM t"
check = """
SELECT concat_ws(',', vs_sum(v), vs_avg(d), vs_count_if(b), vs_spread(v), vs_wavg(d, w), vs_sum_scaled(v, 3)) FROM t
"""
expect = "-50000,0.0,1,0,0.0,-150000"

