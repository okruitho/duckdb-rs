      FROM t GROUP BY g1024)
WHERE s IS DISTINCT FROM s0 OR abs(a - a0) > 1e-9 * (1 + abs(a0)) OR p IS DISTINCT FROM p0 OR c IS DISTINCT FROM c0
"""
