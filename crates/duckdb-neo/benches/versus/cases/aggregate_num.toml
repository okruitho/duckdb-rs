# Aggregates with plain states, see `../rust/aggregate_num.rs`:
# vs_sum(v), vs_avg(d), vs_count_if(b), vs_spread(v), vs_wavg(v, w), vs_sum_scaled(v, factor).
#
# `t` has groups `g4` (4 groups), `g1024` (1,024) and `gq` (rows / 4, four rows each). `d` and `w` are
# multiples of 0.25 below 2^10, so sums stay exact; DOUBLE checks still allow a relative 1e-9.

[[case]]
name = "sum/ungrouped"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT i::BIGINT AS i, (i % 1024)::INTEGER AS g1024, (i * 7919 % 100003 - 50000)::BIGINT AS v
FROM range({rows}) r(i)
"""]
query = "SELECT vs_sum(v) FROM t"
check = """
SELECT (((SELECT vs_sum(v) FROM t) IS DISTINCT FROM (SELECT sum(v)::BIGINT FROM t))::INTEGER
        + ((SELECT vs_sum(v) FROM t WHERE false) IS NOT NULL)::INTEGER
        + ((SELECT vs_sum(x) FROM (VALUES (9223372036854775807), (1)) l(x)) <> -9223372036854775808)::INTEGER
       )::VARCHAR
"""
expect = "0"

[[case]]
name = "sum/group_4"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT i::BIGINT AS i, (i % 4)::INTEGER AS g4, (i * 7919 % 100003 - 50000)::BIGINT AS v
FROM range({rows}) r(i)
"""]
query = "SELECT g4, vs_sum(v) FROM t GROUP BY g4"
check = """
SELECT (count(*) FILTER (WHERE a IS DISTINCT FROM b::BIGINT) + (count(*) <> least({rows}, 4))::INTEGER)::VARCHAR
FROM (SELECT vs_sum(v) AS a, sum(v) AS b FROM t GROUP BY g4)
"""
expect = "0"

