# Eight distinct calls: identical calls would be deduplicated by DuckDB.
[[case]]
name = "sum/eight_calls"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS SELECT i::BIGINT AS i, (i % 1024)::INTEGER AS g1024, (i * 7919 % 100003 - 50000)::BIGINT AS v
FROM range({rows}) r(i)
"""]
query = """
SELECT g1024, vs_sum(v), vs_sum(v + 1), vs_sum(v + 2), vs_sum(v + 3), vs_sum(v + 4), vs_sum(v + 5), vs_sum(v + 6),
       vs_sum(v + 7)
FROM t GROUP BY g1024
"""
check = """
SELECT count(*)::VARCHAR
FROM (SELECT vs_sum(v) AS a0, sum(v) AS b0, vs_sum(v + 3) AS a3, sum(v + 3) AS b3, vs_sum(v + 7) AS a7,
             sum(v + 7) AS b7
      FROM t GROUP BY g1024)
WHERE a0 IS DISTINCT FROM b0::BIGINT OR a3 IS DISTINCT FROM b3::BIGINT OR a7 IS DISTINCT FROM b7::BIGINT
"""
expect = "0"

