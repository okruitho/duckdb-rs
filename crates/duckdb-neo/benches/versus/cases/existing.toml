SELECT (((SELECT row_hash(s, d, b) FILTER (WHERE g % 2 = 0) FROM agg_input)
         IS DISTINCT FROM (SELECT wrap64(sum(h) FILTER (WHERE g % 2 = 0)) FROM per_row))::BIGINT
      + ((SELECT row_hash(s, d, b) FILTER (WHERE g < 0) FROM agg_input) IS NOT NULL)::BIGINT)::VARCHAR
"""
expect = "0"

# A running window without ORDER BY: DuckDB's streaming window updates and finalizes once per row.
[[case]]
name = "row_hash/running"
rows = [1, 1000, 100_000, 1_000_000]
setup = [
    "CREATE MACRO nullable(value, row, seed, percent) AS CASE WHEN hash(row::UBIGINT, seed::UBIGINT) % 100 < percent THEN NULL ELSE value END",
    "CREATE MACRO wrap64(x) AS (x % 18446744073709551616)::UBIGINT",
    """
CREATE TABLE agg_input AS
SELECT (i % 1024)::INTEGER AS g, nullable('key_' || (i * 7919 % 100003), i, 10, 10) AS s,
       nullable(i * 0.25, i, 11, 10)::DOUBLE AS d, nullable(i % 3 = 0, i, 12, 10) AS b
FROM range({rows}) t(i)
""",
]
query = "SELECT row_hash(s, d, b) OVER (ROWS UNBOUNDED PRECEDING) FROM agg_input"
check = """
WITH per_row AS (SELECT rowid AS r, row_hash(s, d, b) AS h FROM agg_input GROUP BY rowid)
SELECT count(*)::VARCHAR
FROM (SELECT row_hash(s, d, b) OVER w AS a, wrap64(sum(h) OVER w) AS e
      FROM agg_input JOIN per_row ON agg_input.rowid = per_row.r
      WINDOW w AS (ORDER BY r ROWS UNBOUNDED PRECEDING))
WHERE a IS DISTINCT FROM e
"""
expect = "0"

