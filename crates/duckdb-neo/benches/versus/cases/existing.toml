# base56: a COPY format for BOOLEAN, INTEGER, BIGINT, DOUBLE and VARCHAR, as in `mod copy` of `benches/functions.rs`.
# `base56/to` also pins the encoder to the golden files, `base56/from` the decoder to a file written by hand.

[[case]]
name = "base56/to"
rows = [1, 1000, 100_000, 1_000_000]
setup = [
    "CREATE MACRO nullable(value, row, seed, percent) AS CASE WHEN hash(row::UBIGINT, seed::UBIGINT) % 100 < percent THEN NULL ELSE value END",
    """
CREATE TABLE copy_input AS
SELECT nullable(i::BIGINT, i, 20, 10) AS id, nullable(i * 1.5, i, 21, 10)::DOUBLE AS x,
       nullable('name_' || i, i, 22, 10) AS name, nullable(i % 2 = 0, i, 23, 10) AS flag,
       nullable((i % 1000)::INTEGER, i, 24, 10) AS bucket
FROM range({rows}) t(i)
""",
    "COPY copy_input TO '{tmp}/data.b56' (FORMAT base56)",
    "CREATE TABLE copy_verify AS FROM copy_input LIMIT 0",
    "COPY copy_verify FROM '{tmp}/data.b56' (FORMAT base56)",
    """
CREATE TABLE copy_edges AS
SELECT CASE i WHEN 0 THEN -9223372036854775808 WHEN 1 THEN 9223372036854775807 WHEN 2 THEN -1 ELSE i END::BIGINT AS id,
       CASE i WHEN 0 THEN 'NaN'::DOUBLE WHEN 1 THEN '-inf'::DOUBLE WHEN 2 THEN -0.0 WHEN 3 THEN 1e308 ELSE i / 7 END::DOUBLE AS x,
       repeat(chr((97 + i)::INTEGER), i::INTEGER) || CASE WHEN i % 3 = 0 THEN 'é' ELSE '' END AS name,
       i % 2 = 1 AS flag,
       CASE i WHEN 0 THEN -2147483648 WHEN 1 THEN 2147483647 WHEN 2 THEN -1 ELSE i END::INTEGER AS bucket
FROM range(14) t(i)
""",
    "COPY copy_edges TO '{tmp}/edges.b56' (FORMAT base56)",
    "CREATE TABLE edges_verify AS FROM copy_edges LIMIT 0",
    "COPY edges_verify FROM '{tmp}/edges.b56' (FORMAT base56)",
    """
COPY (SELECT i::BIGINT AS id, CASE WHEN i % 89 = 0 THEN NULL ELSE i * 1.5 END::DOUBLE AS x,
             CASE WHEN i % 97 = 0 THEN NULL ELSE 'name_' || i END AS name,
             CASE WHEN i % 101 = 0 THEN NULL ELSE i % 2 = 0 END AS flag, (i % 1000)::INTEGER AS bucket
      FROM range(1000) t(i))
TO '{tmp}/golden.b56' (FORMAT base56)
""",
    """
COPY (FROM (VALUES (1, 42::BIGINT, 1.5::DOUBLE, 'duck', true, 7::INTEGER),
                   (2, NULL, NULL, 'DuckDB!', false, NULL),
                   (3, NULL, NULL, '', NULL, NULL)) v(k, id, x, name, flag, bucket)
      SELECT id, x, name, flag, bucket ORDER BY k)
TO '{tmp}/encodings.b56' (FORMAT base56)
""",
]
query = "COPY copy_input TO '{tmp}/data.b56' (FORMAT base56)"
check = """
SELECT ((SELECT count(*) FROM ((FROM copy_input EXCEPT ALL FROM copy_verify) UNION ALL (FROM copy_verify EXCEPT ALL FROM copy_input)))
      + (SELECT count(*) FROM ((FROM copy_edges EXCEPT ALL FROM edges_verify) UNION ALL (FROM edges_verify EXCEPT ALL FROM copy_edges)))
      + (SELECT (size <> 48667 OR NOT starts_with(content,
                    '#base56 BIGINT,DOUBLE,VARCHAR,BOOLEAN,INTEGER' || chr(10) ||
                    '222222222222,~,~,~,222222' || chr(10) ||
                    '222223222222,2222223x9Ays,573hTy63h,22,222223' || chr(10) ||
                    '222224222222,2222223xF9MS,573hTy68H,23,222224' || chr(10)))::BIGINT
         FROM read_text('{tmp}/golden.b56'))
      + (SELECT (content IS DISTINCT FROM
                    '#base56 BIGINT,DOUBLE,VARCHAR,BOOLEAN,INTEGER' || chr(10) ||
                    '22222k222222,2222223x9Ays,5HDDPE,23,222229' || chr(10) ||
                    '~,~,5HDDNe2ER4N,22,~' || chr(10) ||
                    '~,~,,~,~' || chr(10))::BIGINT
         FROM read_text('{tmp}/encodings.b56'))
)::VARCHAR
"""
expect = "0"

