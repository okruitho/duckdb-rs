# The existing duckdb-neo benchmark functions (`benches/support`, `benches/functions.rs`) and their C++ ports.
# Inputs are the modules' `create_input` SQL, with `N(value, seed)` of `benches/instructions.md` spelled as the
# `nullable(value, i, seed, percent)` macro below; the NULL percentage is 10 unless a case name says otherwise.
# Checks reproduce each module's `verify` plus the golden values of `instructions.md` section 8.

# merge_struct(i, s, m, u, d) -> STRUCT(i, s, m, u, d): the arguments as fields, NULL arguments as NULL fields.
# The checks materialize the output, so that their filters are not merged into the query's own WHERE.

[[case]]
name = "merge_struct/project"
rows = [1, 1000, 100_000, 1_000_000]
setup = [
    "CREATE MACRO nullable(value, row, seed, percent) AS CASE WHEN hash(row::UBIGINT, seed::UBIGINT) % 100 < percent THEN NULL ELSE value END",
    """
CREATE TABLE scalar_input AS
SELECT nullable(i::INTEGER, i, 0, 10) AS i,
       nullable('value_' || i, i, 1, 10) AS s,
       nullable(MAP {'a': nullable(i::INTEGER, i, 5, 10), 'b': nullable((i * 2)::INTEGER, i, 6, 10),
                     'key_' || (i % 7): nullable((i % 7)::INTEGER, i, 7, 10)}, i, 2, 10) AS m,
       nullable(CASE WHEN i % 2 = 0 THEN union_value(num := nullable(i::INTEGER, i, 8, 10))::UNION(num INTEGER, str VARCHAR)
                     ELSE union_value(str := nullable('union_string_' || i, i, 9, 10))::UNION(num INTEGER, str VARCHAR) END,
                i, 3, 10) AS u,
       nullable((i / 1000)::DECIMAL(18, 3), i, 4, 10) AS d
FROM range({rows}) t(i)
""",
    "CREATE TABLE merge_edges (i INTEGER, s VARCHAR, m MAP(VARCHAR, INTEGER), u UNION(num INTEGER, str VARCHAR), d DECIMAL(18, 3))",
    """
INSERT INTO merge_edges VALUES
    (NULL, NULL, NULL, NULL, NULL),
    (-2147483648, '', MAP {}, union_value(num := NULL::INTEGER), -999999999999999.999),
    (2147483647, 'a string too long to be inlined', MAP {'nullable': NULL, 'a map key too long to be inlined': 5},
     union_value(str := NULL::VARCHAR), 999999999999999.999),
    (0, 'é', MAP {'k': -1}, union_value(str := 'a union string too long to be inlined'), 0)
""",
]
query = "SELECT merge_struct(i, s, m, u, d) FROM scalar_input"
check = """
WITH output AS MATERIALIZED (
    SELECT merge_struct(i, s, m, u, d) AS r, * FROM (FROM scalar_input UNION ALL FROM merge_edges))
SELECT ((SELECT count(*)
         FROM output
         WHERE r IS NULL OR r.i IS DISTINCT FROM i OR r.s IS DISTINCT FROM s OR r.u IS DISTINCT FROM u
            OR union_tag(r.u) IS DISTINCT FROM union_tag(u) OR r.d IS DISTINCT FROM d
            OR union_extract(r.u, 'num') IS DISTINCT FROM union_extract(u, 'num')
            OR union_extract(r.u, 'str') IS DISTINCT FROM union_extract(u, 'str')
            OR list_sort(map_entries(r.m)) IS DISTINCT FROM list_sort(map_entries(m)))
      + ((SELECT typeof(merge_struct(i, s, m, u, d)) FROM scalar_input LIMIT 1)
         <> 'STRUCT(i INTEGER, s VARCHAR, m MAP(VARCHAR, INTEGER), u UNION(num INTEGER, str VARCHAR), d DECIMAL(18,3))')::BIGINT
      + (SELECT count(*)
         FROM (SELECT merge_struct(i, s, m, u, d) AS r, expected
               FROM (VALUES
                   (0, NULL, MAP {'a': 0, 'b': 0, 'key_0': 0}, union_value(num := 0)::UNION(num INTEGER, str VARCHAR),
                    NULL::DECIMAL(18, 3),
                    '{''i'': 0, ''s'': NULL, ''m'': [{''key'': a, ''value'': 0}, {''key'': b, ''value'': 0}, {''key'': key_0, ''value'': 0}], ''u'': 0, ''d'': NULL}'),
                   (1, 'value_1', MAP {'a': 1, 'b': 2, 'key_1': 1},
                    union_value(str := 'union_string_1')::UNION(num INTEGER, str VARCHAR), 0.001::DECIMAL(18, 3),
                    '{''i'': 1, ''s'': value_1, ''m'': [{''key'': a, ''value'': 1}, {''key'': b, ''value'': 2}, {''key'': key_1, ''value'': 1}], ''u'': union_string_1, ''d'': 0.001}')
               ) v(i, s, m, u, d, expected))
         WHERE {'i': r.i, 's': r.s, 'm': list_sort(map_entries(r.m)), 'u': r.u, 'd': r.d}::VARCHAR IS DISTINCT FROM expected)
)::VARCHAR
"""
expect = "0"

