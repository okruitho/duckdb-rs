[[case]]
name = "row_hash/filter"
rows = [1, 1000, 100_000, 1_000_000]
setup = [
    "CREATE MACRO nullable(value, row, seed, percent) AS CASE WHEN hash(row::UBIGINT, seed::UBIGINT) % 100 < percent THEN NULL ELSE value END",
    "CREATE MACRO wrap64(x) AS (x % 18446744073709551616)::UBIGINT",
    """
CREATE TABLE agg_input AS
SELECT (i % 1024)::INTEGER AS g, nullable('key_' || (i * 7919 % 100003), i, 10, 10) AS s,
       nullable(i * 0.25, i, 11, 10)::DOUBLE AS d, nullable(i % 3 = 0, i, 12, 10) AS b
FROM range({rows}) t(i)
""",
]
