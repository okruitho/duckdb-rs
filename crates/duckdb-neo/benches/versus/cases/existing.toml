# dash_split(input, n) -> TABLE(idx, part): `input` split on '-' into at most `n` parts, like `str::splitn`.
# `split_input` holds `rows` parts, so `n = rows` splits it fully.

[[case]]
name = "dash_split/scan"
rows = [1, 1000, 100_000, 1_000_000]
setup = """
SET VARIABLE split_input = (
    SELECT string_agg(CASE WHEN i % 3 = 0 THEN 'long_segment_' || i ELSE 'p' || i END, '-' ORDER BY i)
    FROM range({rows}) t(i))
"""
query = "SELECT idx, part FROM dash_split(getvariable('split_input'), {rows})"
check = """
WITH expected AS (
         SELECT unnest(range(len(parts)))::BIGINT AS idx, unnest(parts) AS part
         FROM (SELECT string_split(getvariable('split_input'), '-') AS parts)),
     actual AS (
         SELECT idx, part, row_number() OVER () - 1 AS position
         FROM dash_split(getvariable('split_input'), {rows}))
SELECT ((SELECT count(*) FROM actual FULL JOIN expected USING (idx)
         WHERE actual.part IS DISTINCT FROM expected.part OR idx IS DISTINCT FROM position)
      + ((SELECT count(*) FROM dash_split(getvariable('split_input'), {rows})) <> {rows})::BIGINT
      + ((SELECT string_agg(idx || ':' || part, ',' ORDER BY idx) FROM dash_split('a-b-c', 2)) IS DISTINCT FROM '0:a,1:b-c')::BIGINT
      + ((SELECT string_agg(idx || ':' || part, ',' ORDER BY idx) FROM dash_split('a-b-c', 3)) IS DISTINCT FROM '0:a,1:b,2:c')::BIGINT
      + ((SELECT string_agg(idx || ':' || part, ',' ORDER BY idx) FROM dash_split('a-b-c', 10)) IS DISTINCT FROM '0:a,1:b,2:c')::BIGINT
      + ((SELECT string_agg(idx || ':' || part, ',' ORDER BY idx) FROM dash_split('-a--b-', 10)) IS DISTINCT FROM '0:,1:a,2:,3:b,4:')::BIGINT
      + ((SELECT string_agg(idx || ':' || part, ',' ORDER BY idx) FROM dash_split('', 1)) IS DISTINCT FROM '0:')::BIGINT
      + ((SELECT string_agg(idx || ':' || part, ',' ORDER BY idx) FROM dash_split('a-b', 1)) IS DISTINCT FROM '0:a-b')::BIGINT
      + (SELECT count(*) FROM dash_split('abc', 0))
      + ((SELECT string_agg(part, ',') FROM dash_split('a-b-c', 3)) IS DISTINCT FROM 'a,b,c')::BIGINT
      + (SELECT count(*) FROM dash_split(NULL, 3))
      + (SELECT count(*) FROM dash_split('a-b', NULL))
)::VARCHAR
"""
expect = "0"

