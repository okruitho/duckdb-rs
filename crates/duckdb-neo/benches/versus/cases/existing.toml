# row_hash(s, d, b) -> UBIGINT: wrapping sum of per-row hashes. The ungrouped check pins the hash to the golden
# values; the others compare each shape with the builtin sum (mod 2^64) of the per-row hashes.

[[case]]
name = "row_hash/ungrouped"
rows = [1, 1000, 100_000, 1_000_000]
setup = [
    "CREATE MACRO nullable(value, row, seed, percent) AS CASE WHEN hash(row::UBIGINT, seed::UBIGINT) % 100 < percent THEN NULL ELSE value END",
    "CREATE MACRO wrap64(x) AS (x % 18446744073709551616)::UBIGINT",
    """
CREATE TABLE agg_input AS
SELECT (i % 1024)::INTEGER AS g, nullable('key_' || (i * 7919 % 100003), i, 10, 10) AS s,
       nullable(i * 0.25, i, 11, 10)::DOUBLE AS d, nullable(i % 3 = 0, i, 12, 10) AS b
FROM range({rows}) t(i)
""",
    """
CREATE TABLE golden_agg_input AS
SELECT CASE WHEN i % 89 = 0 THEN NULL ELSE 'key_' || (i * 7919 % 100003) END AS s,
       CASE WHEN i % 97 = 0 THEN NULL ELSE i * 0.25 END::DOUBLE AS d,
       CASE WHEN i % 101 = 0 THEN NULL ELSE i % 3 = 0 END AS b, i < 1000 AS first_1000
FROM range(10000) t(i)
""",
]
query = "SELECT row_hash(s, d, b) FROM agg_input"
check = """
WITH per_row AS (SELECT rowid AS r, row_hash(s, d, b) AS h FROM agg_input GROUP BY rowid)
SELECT (((SELECT row_hash(s, d, b) FROM agg_input) IS DISTINCT FROM (SELECT wrap64(sum(h)) FROM per_row))::BIGINT
      + ((SELECT row_hash(s, d, b) FROM agg_input WHERE false) IS NOT NULL)::BIGINT
      + ((SELECT row_hash('duck', 1.5, true)) IS DISTINCT FROM 17517133033816018756)::BIGINT
      + ((SELECT row_hash(s, d, b) FROM (SELECT NULL::VARCHAR AS s, NULL::DOUBLE AS d, NULL::BOOLEAN AS b))
         IS DISTINCT FROM 16898831758259097429)::BIGINT
      + ((SELECT row_hash('', 0.0, false)) IS DISTINCT FROM 15861653319075095682)::BIGINT
      + ((SELECT row_hash(s, d, b) FROM golden_agg_input WHERE first_1000) IS DISTINCT FROM 13117526009623259447)::BIGINT
      + ((SELECT row_hash(s, d, b) FROM golden_agg_input) IS DISTINCT FROM 15537843542995968811)::BIGINT
)::VARCHAR
"""
expect = "0"

