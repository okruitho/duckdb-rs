# About ten columns of every supported type, without NULLs and with half of them NULL.
[[case]]
name = "lines_to/wide"
rows = [1, 2048, 100_000, 1_000_000]
setup = [
    '''CREATE TABLE src AS SELECT i::BIGINT AS id, (i * 7919 % 100003 - 50000)::BIGINT AS a, (hash(i) >> 1)::BIGINT AS b,
         (i * 0.25)::DOUBLE AS x, (i / 7)::DOUBLE AS y, sqrt(i) * 1e10 AS z, i % 3 = 0 AS f, i % 5 = 0 AS g,
         'name_' || i AS s, CASE i % 4 WHEN 0 THEN '' WHEN 1 THEN 'tab' || chr(9) || i WHEN 2 THEN repeat('long', 10)
         ELSE 'back\slash' END AS t
       FROM range({rows}) r(i)''',
    '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)''',
    "CREATE TABLE dst AS FROM src LIMIT 0",
    '''COPY dst FROM '{tmp}/out.tsv' (FORMAT vs_lines)''',
]
query = '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)'''
check = '''
SELECT CASE WHEN (SELECT count(*) FROM ((FROM src EXCEPT ALL FROM dst) UNION ALL (FROM dst EXCEPT ALL FROM src))) = 0
            THEN (SELECT md5(content) FROM read_text('{tmp}/out.tsv')) ELSE 'round trip differs' END
'''

[case.expect_at]
1 = "392ef5287838207fbda7bd31907ad18c"
2048 = "1a5713a003e2474c2ec837e0ef9a2edb"
100000 = "d4aa2cdda00cacf47f062de56b2d118e"
1000000 = "2ba4ae568f37f10812db9ba470d4f79d"

