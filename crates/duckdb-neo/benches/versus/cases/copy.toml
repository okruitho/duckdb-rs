# DOUBLE edge values: NaN, infinities, -0.0, the smallest subnormal, the largest finite value, NULL.
[[case]]
name = "lines_to/double"
rows = [1, 2048, 100_000, 2_000_000]
setup = [
    '''CREATE TABLE src AS SELECT CASE i % 10 WHEN 1 THEN 'nan'::DOUBLE WHEN 2 THEN 'inf'::DOUBLE WHEN 3 THEN '-inf'::DOUBLE
         WHEN 4 THEN '-0.0'::DOUBLE WHEN 5 THEN 5e-324 WHEN 6 THEN 1.7976931348623157e308 WHEN 7 THEN NULL
         ELSE (i - {rows} // 2) / 7 END::DOUBLE AS v
       FROM range({rows}) r(i)''',
    '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)''',
    "CREATE TABLE dst AS FROM src LIMIT 0",
    '''COPY dst FROM '{tmp}/out.tsv' (FORMAT vs_lines)''',
]
query = '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)'''
check = '''
SELECT CASE WHEN (SELECT count(*) FROM ((FROM src EXCEPT ALL FROM dst) UNION ALL (FROM dst EXCEPT ALL FROM src))) = 0
                 AND (SELECT count(*) FROM dst WHERE v = 0 AND signbit(v)) = (SELECT count(*) FROM src WHERE v = 0 AND signbit(v))
            THEN (SELECT md5(content) FROM read_text('{tmp}/out.tsv')) ELSE 'round trip differs' END
'''

[case.expect_at]
1 = "4b578ff832d2c3f00d2f260f1c5aeb05"
2048 = "81ce8a2e20dcdc1182204dc47cfcda61"
100000 = "148510495c616ff0d8d6ecd046f0b074"
2000000 = "87f0fabb250e4afd6c274b38c0ec829b"

