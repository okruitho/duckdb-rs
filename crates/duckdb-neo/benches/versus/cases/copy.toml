# vs_lines: COPY TO/FROM a tab-separated text format (see rust/copy.rs for the full format).
#   One row per line, NULL as \N, VARCHAR escaping \ as \\, newline as \n and the separator as \<sep>.
#   Option sep: the field separator, one ASCII punctuation or whitespace character (default tab).
# vs_fixed: COPY TO/FROM a binary BIGINT/DOUBLE format: header, then a validity byte and 8 LE bytes per value.
#
# COPY TO cases run the timed statement once in setup, so the check sees the file it writes. Where every column
# is BIGINT, BOOLEAN or VARCHAR the check rebuilds the expected file text in builtin SQL; where DOUBLE or vs_fixed
# is involved it reads the file back with COPY FROM and, when the round trip holds, returns the file's md5, which
# also makes the driver require byte-identical files from both languages.
# COPY FROM cases write their input in setup and load it once there for the check; `reset` empties the target.

# ---------------------------------------------------------------------------------------------------------------------
# vs_lines, COPY TO
# ---------------------------------------------------------------------------------------------------------------------

[[case]]
name = "lines_to/bigint"
rows = [1, 2048, 100_000, 2_000_000]
setup = [
    '''CREATE TABLE src AS SELECT CASE i WHEN 0 THEN -9223372036854775808 WHEN 1 THEN 9223372036854775807
       ELSE i * 7919 - {rows}::BIGINT * 4000 END::BIGINT AS v FROM range({rows}) r(i)''',
    '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)''',
]
query = '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)'''
check = '''
SELECT ((SELECT content FROM read_text('{tmp}/out.tsv'))
        IS DISTINCT FROM (SELECT coalesce(string_agg(v::VARCHAR || chr(10), '' ORDER BY rowid), '') FROM src))::INT::VARCHAR
'''
expect = "0"

