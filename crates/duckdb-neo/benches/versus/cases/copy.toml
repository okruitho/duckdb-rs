# Every escape: tab (the separator), newline, backslash, a literal \N, the empty string, NULL and non-ASCII text.
# The check rebuilds the text in SQL and also reads the file back.
[[case]]
name = "lines_to/varchar_escapes"
rows = [1, 2048, 100_000, 1_000_000]
setup = [
    '''CREATE TABLE src AS SELECT i::BIGINT AS id, CASE i % 8
         WHEN 0 THEN 'plain ' || i WHEN 1 THEN 'tab' || chr(9) || i WHEN 2 THEN 'line' || chr(10) || 'break' || i
         WHEN 3 THEN 'back\slash\\' || i WHEN 4 THEN '\N' WHEN 5 THEN '' WHEN 6 THEN NULL
         ELSE 'ünïcødé 🦆 ' || i END AS s
       FROM range({rows}) r(i)''',
    '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)''',
    "CREATE TABLE dst AS FROM src LIMIT 0",
    '''COPY dst FROM '{tmp}/out.tsv' (FORMAT vs_lines)''',
]
query = '''COPY src TO '{tmp}/out.tsv' (FORMAT vs_lines)'''
check = '''
SELECT (((SELECT content FROM read_text('{tmp}/out.tsv'))
         IS DISTINCT FROM (SELECT coalesce(string_agg(id::VARCHAR || chr(9) || coalesce(
                                   replace(replace(replace(s, '\', '\\'), chr(10), '\n'), chr(9), '\' || chr(9)), '\N')
                                   || chr(10), '' ORDER BY rowid), '') FROM src))::INT
        + (SELECT count(*) FROM ((FROM src EXCEPT ALL FROM dst) UNION ALL (FROM dst EXCEPT ALL FROM src))))::VARCHAR
'''
expect = "0"

