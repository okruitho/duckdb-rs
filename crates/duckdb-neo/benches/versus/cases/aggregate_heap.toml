# ---------------------------------------------------------------------------------------------------------------------
# Every function in one query
# ---------------------------------------------------------------------------------------------------------------------

# One row: the fixed cost of six aggregates, each with one state.
[[case]]
name = "all/one_row"
rows = [1]
setup = ["CREATE TABLE t AS SELECT 7::BIGINT AS v, 2.5::DOUBLE AS d, 'only' AS s"]
query = """
SELECT vs_longest(s), vs_distinct_count(v), vs_median(d), vs_sorted_list(v), vs_top3(v), vs_concat_sorted(s) FROM t
"""
check = """
SELECT ((vs_longest(s) IS DISTINCT FROM 'only')::INTEGER + (vs_distinct_count(v) IS DISTINCT FROM 1)::INTEGER
        + (vs_median(d) IS DISTINCT FROM 2.5)::INTEGER + (vs_sorted_list(v) IS DISTINCT FROM [7])::INTEGER
        + (vs_top3(v) IS DISTINCT FROM [7])::INTEGER + (vs_concat_sorted(s) IS DISTINCT FROM 'only')::INTEGER)::VARCHAR
FROM t
"""
expect = "0"

[[case]]
name = "all/groups_1024"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, (i % 1024)::INTEGER AS g1024, (i * 7919 % 100)::BIGINT AS v, (i * 7919 % 100003)::DOUBLE / 8 AS d,
       'k' || (i * 7919 % 1009) AS s
FROM range({rows}) r(i)
"""]
query = """
SELECT g1024, vs_longest(s), vs_distinct_count(v), vs_median(d), vs_sorted_list(v), vs_top3(v), vs_concat_sorted(s)
FROM t GROUP BY g1024
"""
check = """
SELECT count(*) FILTER (WHERE a1 IS DISTINCT FROM b1 OR a2 IS DISTINCT FROM b2 OR a3 IS DISTINCT FROM b3
                           OR a4 IS DISTINCT FROM b4 OR a5 IS DISTINCT FROM b5 OR a6 IS DISTINCT FROM b6)::VARCHAR
FROM (SELECT vs_longest(s) AS a1, arg_min(s, {'l': -strlen(s), 's': s}) FILTER (WHERE s IS NOT NULL) AS b1,
             vs_distinct_count(v) AS a2, count(DISTINCT v) AS b2,
             vs_median(d) AS a3, quantile_disc(d, 0.5) AS b3,
             vs_sorted_list(v) AS a4, list_sort(list(v) FILTER (WHERE v IS NOT NULL)) AS b4,
             vs_top3(v) AS a5, max(v, 3) AS b5,
             vs_concat_sorted(s) AS a6, string_agg(s, ',' ORDER BY s) AS b6
      FROM t GROUP BY g1024)
"""
expect = "0"
