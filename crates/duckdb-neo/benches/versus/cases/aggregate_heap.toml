# Aggregates whose states own heap memory (see rust/aggregate_heap.rs for the semantics).
#
# Shared columns: `i` is the row number, `g4`, `g1024` and `gq` give 4, 1,024 and about rows / 4 groups, `v` is a
# BIGINT, `d` a DOUBLE and `s` a VARCHAR. Every check compares with builtin SQL and counts the mismatching rows:
#   vs_longest(s)       arg_min(s, {'l': -strlen(s), 's': s}) FILTER (WHERE s IS NOT NULL)
#   vs_distinct_count   count(DISTINCT v)
#   vs_median(d)        quantile_disc(d, 0.5)
#   vs_sorted_list(v)   list_sort(list(v) FILTER (WHERE v IS NOT NULL))
#   vs_top3(v)          max(v, 3)
#   vs_concat_sorted(s) string_agg(s, ',' ORDER BY s)

# ---------------------------------------------------------------------------------------------------------------------
# vs_longest
# ---------------------------------------------------------------------------------------------------------------------

# Short strings, with empty and multi-byte ones, so ties and byte lengths matter.
[[case]]
name = "longest/ungrouped"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE WHEN i % 101 = 0 THEN '' WHEN i % 101 = 1 THEN 'é' || (i % 7) ELSE 'k' || (i * 7919 % 1009) END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT vs_longest(s) FROM t"
check = """
SELECT (count(*) FILTER (WHERE a IS DISTINCT FROM b) + count(*) FILTER (WHERE e IS NOT NULL))::VARCHAR
FROM (SELECT vs_longest(s) AS a, arg_min(s, {'l': -strlen(s), 's': s}) FILTER (WHERE s IS NOT NULL) AS b,
             vs_longest(s) FILTER (WHERE false) AS e
      FROM t)
"""
expect = "0"

