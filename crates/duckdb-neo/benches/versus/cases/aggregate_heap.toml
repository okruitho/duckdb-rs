SELECT i, (i % 1024)::INTEGER AS g1024, repeat('long-', 3 + i % 5) || (i * 7919 % 100003) AS s
FROM range({rows}) r(i)
"""]
query = "SELECT g1024, vs_longest(s) FROM t GROUP BY g1024"
check = """
SELECT count(*) FILTER (WHERE a IS DISTINCT FROM b)::VARCHAR
FROM (SELECT vs_longest(s) AS a, arg_min(s, {'l': -strlen(s), 's': s}) FILTER (WHERE s IS NOT NULL) AS b
      FROM t GROUP BY g1024)
"""
expect = "0"

