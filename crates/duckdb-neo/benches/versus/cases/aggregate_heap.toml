# DuckDB aggregates each partition once and repeats the result on its rows.
[[case]]
name = "longest/whole_partition"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, (i % 1024)::INTEGER AS g1024, 'k' || (i * 7919 % 100003) AS s
FROM range({rows}) r(i)
"""]
query = "SELECT vs_longest(s) OVER (PARTITION BY g1024) FROM t"
check = """
SELECT count(*) FILTER (WHERE a IS DISTINCT FROM b)::VARCHAR
FROM (SELECT vs_longest(s) OVER w AS a,
             arg_min(s, {'l': -strlen(s), 's': s}) FILTER (WHERE s IS NOT NULL) OVER w AS b
      FROM t WINDOW w AS (PARTITION BY g1024))
"""
expect = "0"

