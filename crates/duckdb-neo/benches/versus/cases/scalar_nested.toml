# Builds a list from scalars, scales it and sums it: three list functions back to back.
[[case]]
name = "nested/scale_range_sum"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT CASE WHEN i % 10 = 9 THEN NULL ELSE (i % 18 - 1)::INTEGER END AS n FROM range({rows}) r(i)"]
query = "SELECT vs_list_sum(vs_list_scale(vs_range_list(n)::BIGINT[], 3)) FROM t"
check = """
SELECT count(*)::VARCHAR FROM t
WHERE vs_list_sum(vs_list_scale(vs_range_list(n)::BIGINT[], 3))
      IS DISTINCT FROM CASE WHEN n IS NOT NULL THEN 3 * (greatest(n, 0)::BIGINT * greatest(n - 1, 0) // 2) END
"""
expect = "0"

[[case]]
name = "split/project"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT CASE WHEN i % 10 = 9 THEN NULL
       ELSE array_to_string(list_transform(range(i % 9),
                                           lambda x: CASE WHEN x % 3 = 0 THEN 'long_segment_' || (x * i) ELSE 'p' || x END),
                            ',') END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT vs_split(s, ',') FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_split(s, ',') IS DISTINCT FROM string_split(s, ','))
        + (vs_split('', ',') IS DISTINCT FROM [''])::BIGINT
        + (vs_split(',a,,b,', ',') IS DISTINCT FROM ['', 'a', '', 'b', ''])::BIGINT
        + (vs_split('a string longer than twelve bytes', ' ') IS DISTINCT FROM
           ['a', 'string', 'longer', 'than', 'twelve', 'bytes'])::BIGINT
        + (vs_split('héllo-wörld', '-') IS DISTINCT FROM ['héllo', 'wörld'])::BIGINT
        + (vs_split(NULL, ',') IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

