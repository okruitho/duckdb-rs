# Several nested functions over the same rows in one projection.
[[case]]
name = "many_calls"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT CASE WHEN i % 10 = 9 THEN NULL
       ELSE list_transform(range(i % 17), lambda x: CASE WHEN (x + i) % 7 = 3 THEN NULL ELSE x * 1000003 + i END) END AS l,
       (i % 18 - 1)::INTEGER AS n,
       (i * 0.37)::DOUBLE AS x
FROM range({rows}) r(i)
"""]
query = "SELECT vs_list_sum(l), vs_list_scale(l, 2), vs_range_list(n), vs_make_point(x, x), vs_list_of_points(n) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_list_sum(l) IS DISTINCT FROM CASE WHEN l IS NOT NULL THEN coalesce(list_sum(l), 0)::BIGINT END
                            OR vs_list_scale(l, 2) IS DISTINCT FROM list_transform(l, lambda v: v * 2)
                            OR vs_range_list(n) IS DISTINCT FROM range(n)::INTEGER[]
                            OR vs_make_point(x, x) IS DISTINCT FROM {'x': x, 'y': x}::STRUCT(x DOUBLE, y DOUBLE)
                            OR vs_list_of_points(n) IS DISTINCT FROM
                               list_transform(range(n), lambda i: {'x': i::DOUBLE, 'y': (i * i)::DOUBLE})))::VARCHAR
FROM t
"""
expect = "0"

# DuckDB's test vectors in every layout (CONSTANT, DICTIONARY, FLAT) and with extreme values, read straight
# from the table function; the row count is fixed.
[[case]]
name = "layouts"
rows = [1]
query = """
SELECT vs_list_sum(l), vs_list_scale(l, 1), vs_list_join(s, ','), vs_point_norm(p), vs_map_sum(m)
FROM test_vector_types(NULL::BIGINT[], NULL::VARCHAR[], NULL::STRUCT(x DOUBLE, y DOUBLE), NULL::MAP(VARCHAR, INTEGER),
                       all_flat := false) t(l, s, p, m)
"""
check = """
SELECT count(*)::VARCHAR
FROM test_vector_types(NULL::BIGINT[], NULL::VARCHAR[], NULL::STRUCT(x DOUBLE, y DOUBLE), NULL::MAP(VARCHAR, INTEGER),
                       all_flat := false) t(l, s, p, m)
WHERE vs_list_sum(l) IS DISTINCT FROM CASE WHEN l IS NOT NULL THEN coalesce(list_sum(l), 0)::BIGINT END
   OR vs_list_scale(l, 1) IS DISTINCT FROM l
   OR vs_list_join(s, ',') IS DISTINCT FROM CASE WHEN s IS NOT NULL THEN coalesce(array_to_string(s, ','), '') END
   OR vs_point_norm(p) IS DISTINCT FROM sqrt(p.x * p.x + p.y * p.y)
   OR vs_map_sum(m) IS DISTINCT FROM CASE WHEN m IS NOT NULL THEN coalesce(list_sum(map_values(m)), 0)::BIGINT END
"""
expect = "0"
