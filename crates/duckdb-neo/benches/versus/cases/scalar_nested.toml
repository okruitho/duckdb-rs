# The filter slices its output, so the function receives a selection of the scanned vector.
[[case]]
name = "list_sum/filtered"
rows = [1, 5000, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE WHEN i % 10 = 9 THEN NULL
          ELSE list_transform(range(i % 17), lambda x: CASE WHEN (x + i) % 7 = 3 THEN NULL ELSE x * 1000003 + i END) END AS l
FROM range({rows}) r(i)
"""]
query = "SELECT vs_list_sum(l) FROM t WHERE i % 3 <> 1"
check = """
SELECT count(*)::VARCHAR
FROM (SELECT l, vs_list_sum(l) AS s FROM t WHERE i % 3 <> 1)
WHERE s IS DISTINCT FROM CASE WHEN l IS NOT NULL THEN coalesce(list_sum(l), 0)::BIGINT END
"""
expect = "0"

[[case]]
name = "list_sum/in_where"
rows = [1, 5000, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE WHEN i % 10 = 9 THEN NULL
          ELSE list_transform(range(i % 17), lambda x: CASE WHEN (x + i) % 7 = 3 THEN NULL ELSE x * 1000003 + i END) END AS l
FROM range({rows}) r(i)
"""]
query = "SELECT i FROM t WHERE vs_list_sum(l) > 40000000"
check = """
SELECT ((SELECT count(*) FROM t WHERE vs_list_sum(l) > 40000000)
        - (SELECT count(*) FROM t WHERE l IS NOT NULL AND coalesce(list_sum(l), 0) > 40000000))::VARCHAR
"""
expect = "0"

[[case]]
name = "list_scale/project"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT CASE WHEN i % 10 = 9 THEN NULL
       ELSE list_transform(range(i % 17), lambda x: CASE WHEN (x + i) % 7 = 3 THEN NULL ELSE x * 1000003 + i END) END AS l,
       CASE WHEN i % 13 = 5 THEN NULL ELSE i % 5 - 2 END AS k
FROM range({rows}) r(i)
"""]
query = "SELECT vs_list_scale(l, k) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_list_scale(l, k) IS DISTINCT FROM
                          CASE WHEN k IS NOT NULL THEN list_transform(l, lambda x: x * k) END)
        + count(*) FILTER (WHERE vs_list_scale([1, NULL, 3], k) IS DISTINCT FROM
                            CASE WHEN k IS NOT NULL THEN [k, NULL, 3 * k] END)
        + (vs_list_scale([4611686018427387904, NULL, -3], 2) IS DISTINCT FROM
           [(-9223372036854775808)::BIGINT, NULL, -6])::BIGINT
        + (vs_list_scale([]::BIGINT[], 2) IS DISTINCT FROM []::BIGINT[])::BIGINT
        + (vs_list_scale([1], NULL) IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

