# vs_* functions over LIST, STRUCT, ARRAY and MAP; see ../rust/scalar_nested.rs for their semantics.
# Each check counts the rows where a function differs from builtin SQL, plus edge inputs.
# Short lists hold 0 to 16 elements (about 8), long ones about 1,000.

[[case]]
name = "list_sum/project"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT CASE WHEN i % 10 = 9 THEN NULL
       ELSE list_transform(range(i % 17), lambda x: CASE WHEN (x + i) % 7 = 3 THEN NULL ELSE x * 1000003 + i END) END AS l
FROM range({rows}) r(i)
"""]
query = "SELECT vs_list_sum(l) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_list_sum(l) IS DISTINCT FROM
                          CASE WHEN l IS NOT NULL THEN coalesce(list_sum(l), 0)::BIGINT END)
        + (vs_list_sum([9223372036854775807, 1]) IS DISTINCT FROM (-9223372036854775808)::BIGINT)::BIGINT
        + (vs_list_sum([]::BIGINT[]) IS DISTINCT FROM 0)::BIGINT
        + (vs_list_sum([NULL, NULL]::BIGINT[]) IS DISTINCT FROM 0)::BIGINT
        + (vs_list_sum(NULL::BIGINT[]) IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

