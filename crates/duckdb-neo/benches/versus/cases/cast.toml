# DuckDB binds `vs_cents < DOUBLE` only through the implicit vs_cents -> DOUBLE cast.
[[case]]
name = "cents_to_double/implicit_compare"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, ((i * 7919) % 2000001 - 1000000)::BIGINT::vs_cents AS c,
       (((i * 104729) % 2000001) - 1000000)::DOUBLE / 100 AS d
FROM range({rows}) r(i)
"""]
query = "SELECT i FROM t WHERE c < d"
check = """
SELECT count(*) FILTER (WHERE (c < d) IS DISTINCT FROM (c::BIGINT::DOUBLE / 100 < d))::VARCHAR
FROM t
"""
expect = "0"

# `abs` has no vs_cents overload, so the binder casts the argument to DOUBLE.
[[case]]
name = "cents_to_double/implicit_argument"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["CREATE TABLE t AS SELECT ((i * 7919) % 2000001 - 1000000)::BIGINT::vs_cents AS c FROM range({rows}) r(i)"]
query = "SELECT abs(c) FROM t"
check = """
SELECT (count(*) FILTER (WHERE abs(c) IS DISTINCT FROM abs(c::BIGINT::DOUBLE / 100))
      + (max(typeof(abs(c))) <> 'DOUBLE')::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# VARCHAR -> vs_cents

[[case]]
name = "varchar_to_cents/project"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS
SELECT v, printf('%s%d.%02d', CASE WHEN v < 0 THEN '-' ELSE '' END, abs(v) // 100, abs(v) % 100) AS s
FROM (SELECT ((i * 7919) % 2000001 - 1000000)::BIGINT AS v FROM range({rows}) r(i))
"""]
query = "SELECT s::vs_cents FROM t"
check = """
SELECT ((SELECT count(*) FROM t WHERE s::vs_cents::BIGINT IS DISTINCT FROM v)
      + (SELECT count(*)
         FROM (VALUES ('92233720368547758.07', 9223372036854775807::BIGINT),
                      ('-92233720368547758.08', (-9223372036854775808)::BIGINT),
                      ('92233720368547758.08', NULL), ('-92233720368547758.09', NULL),
                      ('1.5', 150), ('-0.05', -5), ('007', 700), ('-0', 0), ('0.00', 0),
                      ('', NULL), ('-', NULL), ('.5', NULL), ('1.', NULL), ('1.234', NULL), ('1e5', NULL),
                      (' 1', NULL), ('1 ', NULL), ('+1', NULL), ('--1', NULL), ('1.-5', NULL),
                      ('99999999999999999999', NULL), ('ünïcode', NULL), (NULL, NULL)) e(text, expected)
         WHERE TRY_CAST(text AS vs_cents)::BIGINT IS DISTINCT FROM expected
            OR (text IS NOT NULL AND expected IS NULL AND try(CAST(text AS vs_cents) IS NULL) IS NOT NULL)))::VARCHAR
"""
expect = "0"

