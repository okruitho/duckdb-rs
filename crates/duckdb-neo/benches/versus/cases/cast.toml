# Several casts in one query

[[case]]
name = "many_casts"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS
SELECT v, v::vs_cents AS c, v::DOUBLE / 100 + 0.001 AS d,
       printf('%s%d.%02d', CASE WHEN v < 0 THEN '-' ELSE '' END, abs(v) // 100, abs(v) % 100) AS s
FROM (SELECT ((i * 7919) % 2000001 - 1000000)::BIGINT AS v FROM range({rows}) r(i))
"""]
query = "SELECT s::vs_cents, c::VARCHAR, d::vs_cents, v::vs_hex, c::vs_hex FROM t"
check = """
SELECT count(*) FILTER (WHERE s::vs_cents::BIGINT IS DISTINCT FROM v
                           OR c::VARCHAR IS DISTINCT FROM s
                           OR d::vs_cents::BIGINT IS DISTINCT FROM v
                           OR v::vs_hex::VARCHAR IS DISTINCT FROM to_hex(v)
                           OR c::vs_hex::VARCHAR IS DISTINCT FROM to_hex(v))::VARCHAR
FROM t
"""
expect = "0"

# Every cast on one row: the per-query and per-callback costs.
[[case]]
name = "one_row"
rows = [1]
setup = ["""
CREATE TABLE t AS
SELECT '-12.34' AS s, (-1234)::vs_cents AS c, 12.345::DOUBLE AS d, 255::BIGINT AS v, 'ff'::vs_hex AS h
FROM range({rows}) r(i)
"""]
query = "SELECT s::vs_cents, c::DOUBLE, c::VARCHAR, d::vs_cents, v::vs_hex, h::BIGINT, c::vs_hex FROM t"
check = """
SELECT concat_ws(' ', s::vs_cents::BIGINT, c::DOUBLE, c::VARCHAR, d::vs_cents::BIGINT, v::vs_hex::VARCHAR, h::BIGINT,
                 c::vs_hex::VARCHAR)
FROM t
"""
expect = "-1234 -12.34 -12.34 1235 FF 255 FFFFFFFFFFFFFB2E"
