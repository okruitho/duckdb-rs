SELECT ((SELECT count(*) FROM t WHERE v::vs_hex::VARCHAR IS DISTINCT FROM to_hex(v))
      + (SELECT count(*)
         FROM (VALUES (0::BIGINT), (-1::BIGINT), (15::BIGINT), (16::BIGINT), ((-9223372036854775808)::BIGINT),
                      (9223372036854775807::BIGINT), (NULL::BIGINT)) e(v)
         WHERE v::vs_hex::VARCHAR IS DISTINCT FROM to_hex(v)))::VARCHAR
"""
expect = "0"

# 15 or 16 digits, so every result goes to the vector's string heap.
[[case]]
name = "bigint_to_hex/long"
rows = [1, 2048, 100_000, 2_000_000]
