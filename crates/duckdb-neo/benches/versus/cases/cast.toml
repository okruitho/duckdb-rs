# Even rows are lowercase.
[[case]]
name = "hex_to_bigint/project"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS
SELECT v, (CASE WHEN i % 2 = 0 THEN lower(to_hex(v)) ELSE to_hex(v) END)::vs_hex AS h
FROM (SELECT i, (hash(i) >> (i % 63 + 1))::BIGINT * CASE WHEN i % 3 = 0 THEN -1 ELSE 1 END AS v FROM range({rows}) r(i))
"""]
query = "SELECT h::BIGINT FROM t"
check = """
SELECT ((SELECT count(*) FROM t WHERE h::BIGINT IS DISTINCT FROM v)
      + (SELECT count(*)
         FROM (VALUES ('0', 0::BIGINT), ('ff', 255), ('Ff', 255), ('FFFFFFFFFFFFFFFF', -1),
                      ('8000000000000000', (-9223372036854775808)::BIGINT), ('0000000000000001', 1),
                      ('00000000000000001', NULL), ('', NULL), ('g', NULL), ('0x1', NULL), (' 1', NULL),
                      ('-1', NULL), (NULL, NULL)) e(text, expected)
         WHERE TRY_CAST(text::vs_hex AS BIGINT) IS DISTINCT FROM expected
            OR (text IS NOT NULL AND expected IS NULL AND try(CAST(text::vs_hex AS BIGINT) IS NULL) IS NOT NULL)))::VARCHAR
"""
expect = "0"

