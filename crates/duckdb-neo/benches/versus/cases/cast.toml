# Casts on the custom types `vs_cents` (BIGINT cents) and `vs_hex` (VARCHAR, uppercase hex like `to_hex`); see
# rust/cast.rs for the semantics. Checks compare with builtin SQL: `round(d * 100)` for DOUBLE -> vs_cents,
# `printf` for the cents text, `to_hex` for vs_hex. `vs_cents <-> BIGINT` and `VARCHAR <-> vs_hex` are DuckDB's own
# alias casts, which the checks use to get at the representation. A strict failure is detected as
# `try(CAST(...) IS NULL) IS NULL`: `try` turns the raised error into NULL, while a cast that quietly returned NULL
# would make the inner `IS NULL` true.

# DOUBLE -> vs_cents

[[case]]
name = "double_to_cents/project"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["CREATE TABLE t AS SELECT (((i * 7919) % 2000001) - 1000000)::DOUBLE / 1000 AS d FROM range({rows}) r(i)"]
query = "SELECT d::vs_cents FROM t"
check = """
SELECT ((SELECT count(*) FROM t WHERE d::vs_cents::BIGINT IS DISTINCT FROM round(d * 100)::BIGINT)
      + (SELECT count(*)
         FROM (VALUES ('NaN'::DOUBLE), ('inf'::DOUBLE), ('-inf'::DOUBLE), (1e17::DOUBLE), (-1e17::DOUBLE),
                      (-92233720368547758.08::DOUBLE), (92233720368547758.07::DOUBLE), (0.125::DOUBLE),
                      (-0.125::DOUBLE), (2.675::DOUBLE), (0.0::DOUBLE), (-0.0::DOUBLE), (1e-300::DOUBLE),
                      (NULL::DOUBLE)) e(x)
         WHERE TRY_CAST(x AS vs_cents)::BIGINT IS DISTINCT FROM TRY_CAST(round(x * 100) AS BIGINT)
            OR (x IS NOT NULL AND TRY_CAST(x AS vs_cents) IS NULL AND try(CAST(x AS vs_cents) IS NULL) IS NOT NULL))
      + (CAST((-0.125)::DOUBLE AS vs_cents)::BIGINT <> -13)::BIGINT)::VARCHAR
"""
expect = "0"

[[case]]
name = "double_to_cents/try_50"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS
SELECT CASE WHEN i % 2 = 1 THEN ['NaN', 'inf', '-inf', '1e300'][i // 2 % 4 + 1]::DOUBLE
            ELSE (((i * 7919) % 2000001) - 1000000)::DOUBLE / 1000 END AS d
FROM range({rows}) r(i)
"""]
query = "SELECT TRY_CAST(d AS vs_cents) FROM t"
check = """
SELECT (count(*) FILTER (WHERE TRY_CAST(d AS vs_cents)::BIGINT IS DISTINCT FROM TRY_CAST(round(d * 100) AS BIGINT))
      + (count(*) FILTER (WHERE TRY_CAST(d AS vs_cents) IS NULL) <> {rows} // 2)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

