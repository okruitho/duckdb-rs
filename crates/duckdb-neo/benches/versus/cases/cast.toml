# INSERT converts each column to its declared type with the custom cast. The setup inserts once for the check.

[[case]]
name = "insert/double"
rows = [1, 2048, 100_000, 1_000_000]
setup = [
    "CREATE TABLE src AS SELECT i AS id, (((i * 7919) % 2000001) - 1000000)::DOUBLE / 1000 AS d FROM range({rows}) r(i)",
    "CREATE TABLE target (id BIGINT, c vs_cents)",
    "INSERT INTO target SELECT id, d FROM src",
]
query = "INSERT INTO target SELECT id, d FROM src"
reset = "TRUNCATE target"
check = """
SELECT ((SELECT count(*) FROM src LEFT JOIN target USING (id)
         WHERE target.c::BIGINT IS DISTINCT FROM round(src.d * 100)::BIGINT)
      + ((SELECT count(*) FROM target) <> {rows})::BIGINT)::VARCHAR
"""
expect = "0"

