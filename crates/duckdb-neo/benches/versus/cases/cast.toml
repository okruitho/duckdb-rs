# vs_cents -> VARCHAR

# At most 10 characters, so every result is inlined.
[[case]]
name = "cents_to_varchar/short"
rows = [1, 2048, 100_000, 2_000_000]
setup = ["""
CREATE TABLE t AS
SELECT v, v::vs_cents AS c FROM (SELECT ((i * 7919) % 2000001 - 1000000)::BIGINT AS v FROM range({rows}) r(i))
"""]
query = "SELECT c::VARCHAR FROM t"
check = """
SELECT ((SELECT count(*) FROM t
         WHERE c::VARCHAR IS DISTINCT FROM
               printf('%s%d.%02d', CASE WHEN v < 0 THEN '-' ELSE '' END, abs(v) // 100, abs(v) % 100))
      + (SELECT count(*)
         FROM (VALUES ((-9223372036854775808)::BIGINT, '-92233720368547758.08'),
                      (9223372036854775807::BIGINT, '92233720368547758.07'), (0, '0.00'), (5, '0.05'),
                      (-5, '-0.05'), (-100, '-1.00'), (123456, '1234.56'), (NULL, NULL)) e(v, expected)
         WHERE v::vs_cents::VARCHAR IS DISTINCT FROM expected))::VARCHAR
"""
expect = "0"

