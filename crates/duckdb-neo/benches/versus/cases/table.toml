# --- vs_series_filter(n): vs_series applying comparisons with a constant itself ---

# A single pushed-down comparison skips all but the last 99 rows. `i >= a AND i < b` would reach the function as a
# BETWEEN, whose bound inclusivity neither API exposes, so it is not claimed.
# Identical calls in separate scalar subqueries can share their bind data, so the edge calls use distinct counts.
[[case]]
name = "series_filter/tail"
rows = [1, 2048, 100_000, 2_000_000, 20_000_000]
query = "SELECT i FROM vs_series_filter({rows}) WHERE i > {rows} - 100"
check = """
WITH a AS (SELECT i FROM vs_series_filter({rows}) WHERE i > {rows} - 100),
     b AS (SELECT range AS i FROM range(greatest({rows} - 99, 0), {rows}))
SELECT ((SELECT count(*) FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a)))
        + (SELECT count(*) FROM vs_series_filter(101) WHERE i > 9223372036854775807)
        + (SELECT count(*) FROM vs_series_filter(102) WHERE i <= -1)
        + (SELECT count(*) - 1 FROM vs_series_filter(103) WHERE i <= 9223372036854775807 AND i = 99)
        + (SELECT count(*) - 104 FROM vs_series_filter(104) WHERE i >= -9223372036854775808))::VARCHAR
"""
expect = "0"

[[case]]
name = "series_filter/wide"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT i FROM vs_series_filter({rows}) WHERE i > 10"
check = """
WITH a AS (SELECT i FROM vs_series_filter({rows}) WHERE i > 10), b AS (SELECT range AS i FROM range(11, {rows}))
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

[[case]]
name = "series_filter/equal"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT i FROM vs_series_filter({rows}) WHERE i = {rows} - 1"
check = "SELECT (count(*) - 1 + sum(i) - ({rows} - 1))::VARCHAR FROM vs_series_filter({rows}) WHERE i = {rows} - 1"
expect = "0"

# The range predicate is pushed down, the modulo stays with DuckDB.
[[case]]
name = "series_filter/residual"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT count(*) FROM vs_series_filter({rows}) WHERE i < {rows} // 10 + 1 AND i % 3 = 0"
check = """
WITH a AS (SELECT i FROM vs_series_filter({rows}) WHERE i < {rows} // 10 + 1 AND i % 3 = 0),
     b AS (SELECT range AS i FROM range(0, least({rows} // 10 + 1, {rows}), 3))
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

