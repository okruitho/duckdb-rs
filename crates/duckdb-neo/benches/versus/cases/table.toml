# Table functions; see rust/table.rs for their semantics. Checks compare the output with builtin `range()` SQL as
# multisets (symmetric EXCEPT ALL, NULLs compare equal) and add edge calls that must produce no mismatches.

# --- vs_series(n): 0 .. n-1 ---

[[case]]
name = "series/count"
rows = [1, 2048, 100_000, 2_000_000, 20_000_000]
query = "SELECT count(*) FROM vs_series({rows})"
check = """
WITH a AS (SELECT i FROM vs_series({rows})), b AS (SELECT range AS i FROM range({rows}))
SELECT ((SELECT count(*) FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a)))
        + (SELECT count(*) FROM vs_series(0)) + (SELECT count(*) FROM vs_series(NULL))
        + (SELECT count(*) FROM vs_series(-5))
        + (SELECT count(*) FROM vs_series({rows})) - {rows})::VARCHAR
"""
expect = "0"

[[case]]
name = "series/project"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT i FROM vs_series({rows})"
check = """
SELECT count(*)::VARCHAR
FROM (SELECT i, row_number() OVER () - 1 AS r FROM vs_series({rows}))
WHERE i IS DISTINCT FROM r
"""
expect = "0"

