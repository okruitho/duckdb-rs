SELECT ((SELECT count(*) FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a)))
        + (SELECT count(*) FROM vs_series_step(5, 5)) + (SELECT count(*) FROM vs_series_step(5, 1))
        + (SELECT count(*) FROM vs_series_step(NULL, 5)) + (SELECT count(*) FROM vs_series_step(0, 5, step := NULL))
        )::VARCHAR
"""
