[[case]]
name = "series_step/named_negative"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT i FROM vs_series_step({rows}, -{rows}, step := -3)"
check = """
WITH a AS (SELECT i FROM vs_series_step({rows}, -{rows}, step := -3)),
     b AS (SELECT range AS i FROM range({rows}, -{rows}, -3)),
     e AS (SELECT i FROM vs_series_step(-9223372036854775808, 9223372036854775807, step := 4611686018427387904)),
     f AS (SELECT range AS i FROM range(-9223372036854775808, 9223372036854775807, 4611686018427387904)),
     g AS (SELECT i FROM vs_series_step(9223372036854775807, -9223372036854775808, step := -9223372036854775808)),
     h AS (SELECT range AS i FROM range(9223372036854775807, -9223372036854775808, -9223372036854775808))
SELECT ((SELECT count(*) FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a)))
        + (SELECT count(*) FROM ((FROM e EXCEPT ALL FROM f) UNION ALL (FROM f EXCEPT ALL FROM e)))
        + (SELECT count(*) FROM ((FROM g EXCEPT ALL FROM h) UNION ALL (FROM h EXCEPT ALL FROM g)))
        + abs((SELECT count(*) FROM e) - 4))::VARCHAR
"""
expect = "0"

# --- vs_grid(n): six columns behind projection pushdown ---

[[case]]
name = "grid/count"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT count(*) FROM vs_grid({rows})"
check = "SELECT (count(*) - {rows} + (SELECT count(*) FROM vs_grid(0)) + (SELECT count(*) FROM vs_grid(NULL)))::VARCHAR FROM vs_grid({rows})"
expect = "0"

[[case]]
name = "grid/all_columns"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT * FROM vs_grid({rows})"
check = """
WITH a AS (SELECT * FROM vs_grid({rows})),
     b AS (SELECT range AS i, range * range AS sq, range::DOUBLE / 2 AS half, 'row-' || range AS tag,
                  range % 2 = 0 AS even, CASE WHEN range % 5 = 0 THEN NULL ELSE (range % 1000)::INTEGER END AS opt
           FROM range({rows}))
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

[[case]]
name = "grid/one_column"
rows = [1, 2048, 100_000, 2_000_000]
