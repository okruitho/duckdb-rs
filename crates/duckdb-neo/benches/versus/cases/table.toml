check = """
SELECT (count(*) FILTER (WHERE i IS DISTINCT FROM r) + abs(count(*) - {rows}))::VARCHAR
FROM (SELECT i, row_number() OVER () - 1 AS r FROM (SELECT i FROM vs_series(1_000_000_000_000) LIMIT {rows}))
"""
expect = "0"

