name = "series/tiny"
rows = [0, 1]
query = "SELECT i FROM vs_series({rows})"
check = "SELECT (count(*) - {rows} + coalesce(sum(i), 0))::VARCHAR FROM vs_series({rows})"
expect = "0"

[[case]]
name = "series/union_ten_calls"
rows = [1, 64, 2048]
query = """
SELECT count(*) FROM (
  SELECT i FROM vs_series({rows}) UNION ALL SELECT i FROM vs_series({rows} + 1)
  UNION ALL SELECT i FROM vs_series({rows} + 2) UNION ALL SELECT i FROM vs_series({rows} + 3)
  UNION ALL SELECT i FROM vs_series({rows} + 4) UNION ALL SELECT i FROM vs_series({rows} + 5)
  UNION ALL SELECT i FROM vs_series({rows} + 6) UNION ALL SELECT i FROM vs_series({rows} + 7)
  UNION ALL SELECT i FROM vs_series({rows} + 8) UNION ALL SELECT i FROM vs_series({rows} + 9))
"""
check = """
SELECT (sum(i) - sum(DISTINCT n * (n - 1) // 2))::VARCHAR
FROM (SELECT i, {rows} AS n FROM vs_series({rows}) UNION ALL SELECT i, {rows} + 1 FROM vs_series({rows} + 1)
      UNION ALL SELECT i, {rows} + 2 FROM vs_series({rows} + 2) UNION ALL SELECT i, {rows} + 3 FROM vs_series({rows} + 3)
      UNION ALL SELECT i, {rows} + 4 FROM vs_series({rows} + 4) UNION ALL SELECT i, {rows} + 5 FROM vs_series({rows} + 5)
      UNION ALL SELECT i, {rows} + 6 FROM vs_series({rows} + 6) UNION ALL SELECT i, {rows} + 7 FROM vs_series({rows} + 7)
      UNION ALL SELECT i, {rows} + 8 FROM vs_series({rows} + 8) UNION ALL SELECT i, {rows} + 9 FROM vs_series({rows} + 9))
"""
expect = "0"

