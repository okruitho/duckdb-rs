check = """
WITH a AS (SELECT half FROM vs_grid({rows})), b AS (SELECT range::DOUBLE / 2 AS half FROM range({rows}))
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

[[case]]
name = "grid/subset_reordered"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT opt, tag, sq FROM vs_grid({rows})"
check = """
WITH a AS (SELECT opt, tag, sq FROM vs_grid({rows})),
     b AS (SELECT CASE WHEN range % 5 = 0 THEN NULL ELSE (range % 1000)::INTEGER END AS opt, 'row-' || range AS tag,
                  range * range AS sq
           FROM range({rows}))
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

# Filters on two output columns at about 20% and 50% selectivity.
[[case]]
name = "grid/where"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT tag, i FROM vs_grid({rows}) WHERE opt IS NULL OR even"
check = """
WITH a AS (SELECT tag, i FROM vs_grid({rows}) WHERE opt IS NULL OR even),
     b AS (SELECT 'row-' || range AS tag, range AS i FROM range({rows}) WHERE range % 5 = 0 OR range % 2 = 0)
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

[[case]]
name = "grid/group_by"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT even, count(opt), sum(sq), max(tag), avg(half) FROM vs_grid({rows}) GROUP BY even"
check = """
WITH a AS (SELECT even, count(opt) AS c, sum(sq) AS s, max(tag) AS m, avg(half) AS h FROM vs_grid({rows}) GROUP BY even),
     b AS (SELECT range % 2 = 0 AS even, count(*) FILTER (WHERE range % 5 <> 0) AS c, sum(range * range) AS s,
                  max('row-' || range) AS m, avg(range::DOUBLE / 2) AS h
           FROM range({rows}) GROUP BY ALL)
SELECT count(*)::VARCHAR FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a))
"""
expect = "0"

