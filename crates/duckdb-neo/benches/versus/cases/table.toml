# --- vs_repeat_row(s, k, n): one constant row n times ---

[[case]]
name = "repeat_row/all_columns"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT * FROM vs_repeat_row('a constant longer than twelve bytes', 42, {rows})"
check = """
WITH a AS (SELECT * FROM vs_repeat_row('a constant longer than twelve bytes', 42, {rows})),
     b AS (SELECT 'a constant longer than twelve bytes' AS s, 42::BIGINT AS k FROM range({rows}))
SELECT ((SELECT count(*) FROM ((FROM a EXCEPT ALL FROM b) UNION ALL (FROM b EXCEPT ALL FROM a)))
        + (SELECT count(*) FROM vs_repeat_row('x', 1, 0)) + (SELECT count(*) FROM vs_repeat_row('x', 1, NULL)))
       ::VARCHAR
"""
expect = "0"

[[case]]
name = "repeat_row/one_column"
rows = [1, 2048, 100_000, 2_000_000]
query = "SELECT k FROM vs_repeat_row('short', -7, {rows})"
check = """
SELECT (count(*) - {rows} + count(*) FILTER (WHERE k IS DISTINCT FROM -7))::VARCHAR
FROM vs_repeat_row('short', -7, {rows})
"""
expect = "0"

