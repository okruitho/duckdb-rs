# String scalar functions, compared with builtin SQL; see `../rust/scalar_str.rs` for the semantics.
#
# Inputs are built from md5 hex digits with '0' replaced by a space, so they hold words and lowercase letters:
# short is 1 to 12 bytes (inlined), medium 13 to 40, long 200 to 2,000; mixed adds empty strings to all three.
# `upper` stands for the builtin ASCII-only uppercase,
# translate(s, 'abcdefghijklmnopqrstuvwxyz', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ').

# vs_len -------------------------------------------------------------------------------------------------------------

[[case]]
name = "len/short"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT vs_len(s) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_len(s) IS DISTINCT FROM strlen(s))
        + (vs_len('') <> 0)::BIGINT + (vs_len('héllo 🦆') <> 11)::BIGINT
        + (vs_len(NULL) IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

[[case]]
name = "len/long"
rows = [1, 2048, 100_000]
setup = ["CREATE TABLE t AS SELECT i, replace(left(repeat(md5(i::VARCHAR), 63), 200 + i % 1801), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT vs_len(s) FROM t"
check = "SELECT count(*) FILTER (WHERE vs_len(s) IS DISTINCT FROM strlen(s))::VARCHAR FROM t"
expect = "0"

[[case]]
name = "len/nulls_50"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE WHEN i % 2 = 1 THEN NULL ELSE replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT vs_len(s) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_len(s) IS DISTINCT FROM strlen(s))
        + (count(vs_len(s)) <> ({rows} + 1) // 2)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# The function filters rows itself.
[[case]]
name = "len/in_where"
rows = [1, 2048, 100_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE i % 8
    WHEN 0 THEN ''
    WHEN 1 THEN replace(left(repeat(md5(i::VARCHAR), 63), 200 + i % 1801), '0', ' ')
    WHEN 2 THEN replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ')
    WHEN 3 THEN replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ')
    ELSE replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT i FROM t WHERE vs_len(s) > 30"
check = """
SELECT (count(*) FILTER (WHERE (vs_len(s) > 30) IS DISTINCT FROM (strlen(s) > 30))
        + ((SELECT count(*) FROM t WHERE vs_len(s) > 30) <> (SELECT count(*) FROM t WHERE strlen(s) > 30))::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

