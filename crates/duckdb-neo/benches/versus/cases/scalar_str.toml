# vs_first_word ------------------------------------------------------------------------------------------------------

# Mixed lengths with about 10% NULLs; most words are short.
[[case]]
name = "first_word/mixed_nulls_10"
rows = [1, 2048, 100_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE
    WHEN i % 10 = 9 THEN NULL
    WHEN i % 8 = 0 THEN ''
    WHEN i % 8 = 1 THEN replace(left(repeat(md5(i::VARCHAR), 63), 200 + i % 1801), '0', ' ')
    WHEN i % 8 IN (2, 3) THEN replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ')
    ELSE replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT vs_first_word(s) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_first_word(s) IS DISTINCT FROM split_part(s, ' ', 1))
        + (vs_first_word(' lead') <> '')::BIGINT + (vs_first_word('one') <> 'one')::BIGINT
        + (vs_first_word('a longer first word here') <> 'a')::BIGINT
        + (vs_first_word('unbroken_word_longer_than_inline rest') <> 'unbroken_word_longer_than_inline')::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

