SELECT (count(*) FILTER (WHERE vs_repeat(s, n) IS DISTINCT FROM CASE WHEN n < 0 THEN NULL ELSE repeat(s, n) END)
        + (vs_repeat('ab', 0) <> '')::BIGINT + (vs_repeat('ab', -1) IS NOT NULL)::BIGINT
        + (vs_repeat('', 5) <> '')::BIGINT + (vs_repeat('ab', 7) <> 'ababababababab')::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

