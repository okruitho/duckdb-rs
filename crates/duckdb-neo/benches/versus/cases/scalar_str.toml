# The character varies per row; the edge checks cover the errors for '' and multi-byte `c`.
[[case]]
name = "count_char/column"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ') AS s,
    substr('a b9c', 1 + i % 5, 1) AS c
FROM range({rows}) r(i)
"""]
query = "SELECT vs_count_char(s, c) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_count_char(s, c) IS DISTINCT FROM strlen(s) - strlen(replace(s, c, '')))
        + (try(vs_count_char('abc', 'ab')) IS NOT NULL)::BIGINT + (try(vs_count_char('abc', '')) IS NOT NULL)::BIGINT
        + (try(vs_count_char('é', 'é')) IS NOT NULL)::BIGINT + (vs_count_char('', 'a') <> 0)::BIGINT
        + (vs_count_char(NULL, 'ab') IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# vs_has_prefix_any --------------------------------------------------------------------------------------------------

# The function filters rows itself, at about 13% selectivity.
[[case]]
name = "has_prefix_any/in_where"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT i FROM t WHERE vs_has_prefix_any(s, 'a,b,c1')"
check = """
SELECT (count(*) FILTER (WHERE vs_has_prefix_any(s, 'a,b,c1')
                         IS DISTINCT FROM (starts_with(s, 'a') OR starts_with(s, 'b') OR starts_with(s, 'c1')))
        + ((SELECT count(*) FROM t WHERE vs_has_prefix_any(s, 'a,b,c1'))
           <> (SELECT count(*) FROM t WHERE starts_with(s, 'a') OR starts_with(s, 'b') OR starts_with(s, 'c1')))::BIGINT
        + (vs_has_prefix_any('abc', '') IS DISTINCT FROM true)::BIGINT
        + (vs_has_prefix_any('abc', 'x,') IS DISTINCT FROM true)::BIGINT
        + (vs_has_prefix_any('abc', 'x,abcd,bc') IS DISTINCT FROM false)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

[[case]]
name = "has_prefix_any/nulls_10"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE WHEN i % 10 = 9 THEN NULL
    ELSE replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ') END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT vs_has_prefix_any(s, 'ab,cd,e,f 1,9') FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_has_prefix_any(s, 'ab,cd,e,f 1,9')
                         IS DISTINCT FROM (starts_with(s, 'ab') OR starts_with(s, 'cd') OR starts_with(s, 'e')
                                           OR starts_with(s, 'f 1') OR starts_with(s, '9')))
        + (count(vs_has_prefix_any(s, 'ab,cd,e,f 1,9')) <> count(s))::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# Each iteration parses and binds again, splitting the prefixes.
[[case]]
name = "has_prefix_any/unprepared"
rows = [1, 2048]
unprepared = true
setup = ["CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT vs_has_prefix_any(s, 'a,b,c,d,e,f,1,2,3,4') FROM t"
check = """
SELECT count(*) FILTER (WHERE vs_has_prefix_any(s, 'a,b,c,d,e,f,1,2,3,4')
                        IS DISTINCT FROM regexp_matches(s, '^[a-f1-4]'))::VARCHAR
FROM t
"""
expect = "0"

