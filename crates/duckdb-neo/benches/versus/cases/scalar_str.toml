# Combinations -------------------------------------------------------------------------------------------------------

[[case]]
name = "combined/nested"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 1 + i % 40), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT vs_upper_ascii(vs_wrap(vs_first_word(s), '[', ']')) FROM t"
check = """
SELECT count(*) FILTER (WHERE vs_upper_ascii(vs_wrap(vs_first_word(s), '[', ']'))
                        IS DISTINCT FROM '[' || upper(split_part(s, ' ', 1)) || ']')::VARCHAR
FROM t
"""
expect = "0"

[[case]]
name = "combined/many_calls"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 1 + i % 40), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT vs_len(s), vs_upper_ascii(s), vs_first_word(s), vs_null_if_empty(s), vs_count_char(s, 'a') FROM t"
check = """
SELECT count(*) FILTER (WHERE vs_len(s) IS DISTINCT FROM strlen(s)
                           OR vs_upper_ascii(s) IS DISTINCT FROM upper(s)
                           OR vs_first_word(s) IS DISTINCT FROM split_part(s, ' ', 1)
                           OR vs_null_if_empty(s) IS DISTINCT FROM nullif(s, '')
                           OR vs_count_char(s, 'a') IS DISTINCT FROM strlen(s) - strlen(replace(s, 'a', '')))::VARCHAR
FROM t
"""
expect = "0"

# Function results feed aggregates rather than the result set.
[[case]]
name = "combined/aggregate_argument"
rows = [1, 2048, 100_000]
setup = ["""
CREATE TABLE t AS
SELECT i, CASE i % 8
    WHEN 0 THEN ''
    WHEN 1 THEN replace(left(repeat(md5(i::VARCHAR), 63), 200 + i % 1801), '0', ' ')
    WHEN 2 THEN replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ')
    WHEN 3 THEN replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ')
    ELSE replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') END AS s
FROM range({rows}) r(i)
"""]
query = "SELECT sum(vs_len(vs_upper_ascii(s))), max(vs_first_word(s)) FROM t"
check = """
SELECT ((SELECT sum(vs_len(vs_upper_ascii(s))) IS DISTINCT FROM sum(strlen(s))
             OR max(vs_first_word(s)) IS DISTINCT FROM max(split_part(s, ' ', 1)) FROM t))::INTEGER::VARCHAR
"""
expect = "0"

# Low-cardinality values in a compressed database reach the function dictionary-encoded, and its result is the
# grouping key.
[[case]]
name = "combined/group_by_dictionary"
rows = [1, 2048, 100_000, 1_000_000]
setup = [
    "ATTACH ':memory:' AS compressed (COMPRESS)",
    "USE compressed",
    """
CREATE TABLE t AS
SELECT i, (['alpha beta', 'gamma', 'a much longer first word value', '', ' leading space', 'Ünïcode wörds here',
            'delta epsilon zeta'])[1 + i % 7] AS s
FROM range({rows}) r(i)
""",
    "CHECKPOINT",
]
query = "SELECT vs_first_word(s) AS w, count(*) FROM t GROUP BY w"
check = """
WITH f AS (SELECT vs_first_word(s) AS w, count(*) AS n FROM t GROUP BY w),
     b AS (SELECT split_part(s, ' ', 1) AS w, count(*) AS n FROM t GROUP BY w)
SELECT ((SELECT count(*) FROM (FROM f EXCEPT ALL FROM b)) + (SELECT count(*) FROM (FROM b EXCEPT ALL FROM f)))::VARCHAR
"""
expect = "0"

# Fixed per-query and per-call costs.
[[case]]
name = "combined/one_row"
rows = [1]
setup = ["CREATE TABLE t AS SELECT 'one row of text' AS s"]
query = "SELECT vs_wrap(s, '<', '>'), vs_len(s), vs_has_prefix_any(s, 'one,two') FROM t"
check = """
SELECT (vs_wrap(s, '<', '>') IS DISTINCT FROM '<one row of text>'
        OR vs_len(s) IS DISTINCT FROM 15 OR vs_has_prefix_any(s, 'one,two') IS DISTINCT FROM true)::INTEGER::VARCHAR
FROM t
"""
expect = "0"
