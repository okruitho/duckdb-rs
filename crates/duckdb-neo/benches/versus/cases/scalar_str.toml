# vs_wrap ------------------------------------------------------------------------------------------------------------

# Constant affixes; the results straddle the 12-byte inline limit.
[[case]]
name = "wrap/constant_affixes"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') AS s FROM range({rows}) r(i)"]
query = "SELECT vs_wrap(s, '<', '>') FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_wrap(s, '<', '>') IS DISTINCT FROM '<' || s || '>')
        + (vs_wrap('', '', '') <> '')::BIGINT + (vs_wrap('abcdefghij', 'xy', 'z') <> 'xyabcdefghijz')::BIGINT
        + (vs_wrap('a', NULL, 'b') IS NOT NULL)::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# Column affixes of varying length; about 10% of the prefixes are NULL.
[[case]]
name = "wrap/column_affixes"
rows = [1, 2048, 100_000, 1_000_000]
setup = ["""
CREATE TABLE t AS
SELECT i,
    replace(left(md5(i::VARCHAR) || md5((i + 1)::VARCHAR), 13 + i % 28), '0', ' ') AS s,
    CASE WHEN i % 10 = 9 THEN NULL ELSE left('[[[[[[[[', i % 9) END AS p,
    left(']]]]]]]]]]]]]]]]', i % 17) AS x
FROM range({rows}) r(i)
"""]
query = "SELECT vs_wrap(s, p, x) FROM t"
check = """
SELECT (count(*) FILTER (WHERE vs_wrap(s, p, x) IS DISTINCT FROM p || s || x)
        + (count(vs_wrap(s, p, x)) <> count(p))::BIGINT)::VARCHAR
FROM t
"""
expect = "0"

# The joined one-row table reaches the function as a constant vector next to a column.
[[case]]
name = "wrap/constant_input"
rows = [1, 2048, 100_000, 1_000_000]
setup = [
    "CREATE TABLE t AS SELECT i, replace(left(md5(i::VARCHAR), 1 + i % 12), '0', ' ') AS s FROM range({rows}) r(i)",
    "CREATE TABLE k AS SELECT 'a constant value longer than inline' AS c",
]
query = "SELECT vs_wrap(k.c, t.s, '!') FROM t, k"
check = "SELECT count(*) FILTER (WHERE vs_wrap(k.c, t.s, '!') IS DISTINCT FROM t.s || k.c || '!')::VARCHAR FROM t, k"
expect = "0"

# vs_repeat ----------------------------------------------------------------------------------------------------------

# Counts from -1 (NULL) through 4 over short strings.
[[case]]
name = "repeat/short"
rows = [1, 2048, 100_000, 1_000_000]
